<style>
    .lg-toolbar {
        position: relative;
    }
    .lg-info-btn {
        display: inline-block;
        float: right;
        padding: 0 14px;
        line-height: 47px;
        font-size: 1.3rem;
        color: #999;
        transition: color 0.2s;
        user-select: none;
    }
    .lg-info-btn:hover {
        color: #fff;
    }
    .lg-info-popover {
        display: none;
        position: absolute;
        top: 47px;
        right: 0;
        width: 476px;
        background: rgba(10, 12, 20, 0.88);
        border: 1px solid rgba(137, 180, 250, 0.25);
        border-top: none;
        padding: 14px 16px;
        z-index: 1090;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
    }
    .lg-info-btn:hover + .lg-info-popover,
    .lg-info-popover:hover {
        display: block;
    }
    .lg-info-popover table {
        width: 100%;
        border-collapse: collapse;
        font-family: "Space Mono", monospace;
        font-size: 0.75rem;
        color: #cdd6f4;
    }
    .lg-info-popover th {
        text-align: left;
        color: #89b4fa;
        font-weight: 700;
        padding: 4px 12px 4px 0;
        white-space: nowrap;
        vertical-align: top;
        width: 1%;
    }
    .lg-info-popover td {
        padding: 4px 0;
        vertical-align: top;
        line-height: 1.5;
    }
    .lg-info-popover .no-data {
        color: #6c7086;
        font-family: "Space Mono", monospace;
        font-size: 0.75rem;
        font-style: italic;
        margin: 0;
    }
</style>

<script>
    // Shared lightGallery "info" popover: an (i) button appears in the
    // toolbar of the enlarged view and shows a details table on hover.
    // Used by both the gallery-layout include and messier-list.html.
    function lgInfoPopoverHtml(data) {
        data = data || {};
        var hasData =
            data.name || data.constellation || data.date || data.location ||
            data.equipment || data.image_info || data.notes;
        if (!hasData) {
            return '<p class="no-data">Image data not entered</p>';
        }
        var rows = '';
        if (data.name) rows += '<tr><th>Name</th><td>' + data.name + '</td></tr>';
        if (data.constellation) rows += '<tr><th>Constellation</th><td>' + data.constellation + '</td></tr>';
        if (data.date) rows += '<tr><th>Date</th><td>' + data.date.split('|').map(function (s) { return s.trim(); }).join('<br>') + '</td></tr>';
        if (data.location) rows += '<tr><th>Location</th><td>' + data.location + '</td></tr>';
        if (data.equipment) rows += '<tr><th>Equipment</th><td>' + data.equipment.split('|').map(function (s) { return s.trim(); }).join('<br>') + '</td></tr>';
        if (data.image_info) rows += '<tr><th>Image Info</th><td>' + data.image_info.split('|').map(function (s) { return s.trim(); }).join('<br>') + '</td></tr>';
        if (data.notes) rows += '<tr><th>Notes</th><td>' + data.notes.split('|').map(function (s) { return s.trim(); }).join('<br>') + '</td></tr>';
        return '<table>' + rows + '</table>';
    }

    // Wires the info-popover markup/content into a lightGallery instance.
    // imageData must be indexed in the same order as the gallery's items.
    function initLgInfoPopover($gallery, imageData) {
        $gallery.on('onAfterOpen.lg', function () {
            $('.lg-toolbar').append(
                '<span class="lg-info-btn" title="Image Info">&#9432;</span>' +
                '<div class="lg-info-popover"></div>'
            );
            var idx = $('.lg-current').index('.lg-item');
            if (idx < 0) idx = 0;
            $('.lg-info-popover').html(lgInfoPopoverHtml(imageData[idx]));
        });

        $gallery.on('onAfterSlide.lg', function (e, prevIndex, index) {
            $('.lg-info-popover').html(lgInfoPopoverHtml(imageData[index]));
        });
    }
</script>
