{% include lg-info-popover.html %}

<style>
    .image-wrapper {
        position: relative;
    }
    .image-caption {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        background: rgba(10, 12, 20, 0.75);
        padding: 5px 8px;
    }
    .image-caption-title {
        display: block;
        color: #cdd6f4;
        font-size: 0.78rem;
        font-family: "Space Mono", monospace;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
</style>

<div
    id="image-gallery{% if include.id_number %}-{{ include.id_number }}{% endif %}"
    class="image-gallery"
>
    <div
        id="gallery-sizer{% if include.id_number %}-{{ include.id_number }}{% endif %}"
        class="gallery-sizer"
    ></div>
    {% for picture in include.gallery.pictures %}
    <div class="image-wrapper">
        <a
            href="{{ site.url }}{{ site.baseurl }}/assets/astrophotography/{{ include.gallery.picture_path }}/{{ picture.original }}"
            data-responsive="{% for size in picture.sizes %} {{ site.url}}{{ site.baseurl }}/assets/astrophotography/{{ include.gallery.picture_path }}/{{ size }} {{ size | split: '-' | last | split: '.' | first | split: 'x' | first | strip }}{% unless forloop.last %},{% endunless %}{% endfor %}"
            class="image"
            data-object="{{ picture.filename }}"
            {%
            if
            picture.title
            %}
            data-sub-html="<h4>{{ picture.title | escape }}</h4>"
            {%
            endif
            %}
        >
            <img
                title="{{ picture.title }}"
                alt="{{ picture.title }}"
                src="{{ site.url }}{{ site.baseurl }}/assets/astrophotography/{{ include.gallery.picture_path }}/{{ picture.thumbnail }}"
            />
        </a>
        {% if picture.title %}
        <div class="image-caption">
            <span class="image-caption-title">{{ picture.title }}</span>
        </div>
        {% endif %}
    </div>
    {% endfor %}
</div>

<script>
    (function() {
      var imageData{% if include.id_number %}{{ include.id_number }}{% endif %} = [
        {% for picture in include.gallery.pictures %}
        {
          date: {{ picture.date | jsonify }},
          location: {{ picture.location | jsonify }},
          equipment: {{ picture.equipment | jsonify }},
          image_info: {{ picture.image_info | jsonify }},
          constellation: {{ picture.constellation | jsonify }},
          notes: {{ picture.notes | jsonify }}
        }{% unless forloop.last %},{% endunless %}
        {% endfor %}
      ];

      $(document).ready(function() {
        var $gallery{% if include.id_number %}{{ include.id_number }}{% endif %} = $("#image-gallery{% if include.id_number %}-{{ include.id_number }}{% endif %}").lightGallery({
          thumbnail: false,
          selector: '.image'
        });

        var hash = window.location.hash.replace('#', '');
        if (hash) {
          var $target = $('[data-object="' + hash + '"]');
          if ($target.length) {
            setTimeout(function() { $target.trigger('click'); }, 300);
          }
        }

        initLgInfoPopover(
          $gallery{% if include.id_number %}{{ include.id_number }}{% endif %},
          imageData{% if include.id_number %}{{ include.id_number }}{% endif %}
        );
      });

      // init isotope
      // fitRows (not masonry) so images lay out strictly left-to-right,
      // top-to-bottom in the order they appear in the gallery's yml file -
      // masonry's shortest-column packing would reorder them based on
      // each image's height.
      var $grid{% if include.id_number %}{{ include.id_number }}{% endif %} = $('#image-gallery{% if include.id_number %}-{{ include.id_number }}{% endif %}').isotope({
        percentPosition: true,
        itemSelector: '.image-wrapper',
        layoutMode: "fitRows"
      });

      // layout Isotope after each image loads
      $(document).ready(function() {
        $grid{% if include.id_number %}{{ include.id_number }}{% endif %}.imagesLoaded().progress(function() {
          $grid{% if include.id_number %}{{ include.id_number }}{% endif %}.isotope('layout');
        });
      });
    })();
</script>
