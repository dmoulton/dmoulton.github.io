name: Deploy Jekyll site to GitHub Pages

on:
  push:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install dependencies
        run: |
          if [ -f Gemfile ]; then
            bundle config path vendor/bundle
            bundle install
          fi

      - name: Build Jekyll site
        run: |
          # Jekyll build outputs to _site by default
          bundle exec jekyll build --verbose

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v1
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v1

      - name: Wait for GitHub Pages deployment to finish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          # ensure jq is available
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y jq
          fi
          retries=120                # number of polling attempts
          interval=15               # seconds between checks (120 * 15 = 30 minutes)
          total=$((retries * interval))
          echo "Waiting up to ${total} seconds for Pages deployment..."
          for i in $(seq 1 $retries); do
            status=$(curl -s -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              "https://api.github.com/repos/${REPO}/pages" | jq -r '.status // "unknown"')
            echo "Attempt $i/$retries: Pages status = $status"
            if [ "$status" = "built" ] || [ "$status" = "active" ]; then
              echo "Pages is ready (status: $status)"
              exit 0
            fi
            sleep $interval
          done
          echo "Timed out waiting for Pages deployment after ${total} seconds"
          # Optionally fetch last build errors for debugging
          curl -s -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/${REPO}/pages" | jq .
          exit 1
