---
layout: default
---

<div class="home">

  <div class="home-posts">
    <h2 class="page-heading">// Recent Posts</h2>
    <ul class="post-list">
      {% for post in site.posts %}
        {% if post.archived != true %}
          <li>
            <span class="post-meta">{{ post.date | date: "%b %-d, %Y" }}</span>
            <h2>
              <a class="post-link" href="{{ post.url | prepend: site.baseurl }}">{{ post.title }}</a>
            </h2>
          </li>
        {% endif %}
      {% endfor %}
    </ul>
  </div>

  <div class="home-instagram">
    <h2 class="page-heading">
      // <a href="https://www.instagram.com/moulton_astro" target="_blank" rel="noopener">Instagram</a>
    </h2>
    <!-- Instagram feed via behold.so -->
    <figure data-behold-id="V6ZztIfOYr6FCp89p58b"></figure>
    <script src="https://w.behold.so/widget.js" type="module"></script>
  </div>

</div>
